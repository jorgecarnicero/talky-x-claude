[project]
name = "saturn-return-bankrec"
version = "1.0.0"
description = "Bank reconciliation at scale: a rule backbone plus a 16-pass matching cascade that explains every bank line."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "PyMuPDF>=1.24",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# tools/make_dev_dataset.py (LIVE-shaped dev windows carved out of TRAIN)
dev = ["duckdb>=1.0"]

[tool.ruff]
line-length = 120
